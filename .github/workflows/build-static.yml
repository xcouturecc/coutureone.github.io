name: Refresh static blog
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'site/**'
      - 'requirements-build.txt'
      - '.github/workflows/build-static.yml'
permissions:
  contents: write
concurrency:
  group: static-blog-refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/cache@v4
        with:
          path: .cache/images
          key: blog-images-${{ github.run_id }}
          restore-keys: blog-images-
      - run: pip install -r requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/test_routes.cjs
      - run: python -m unittest discover -s tests
      - run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python tests/check_generated.py
      - name: Publish generated pages
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh static blog pages'
            git push
          fi
